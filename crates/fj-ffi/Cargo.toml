[package]
name = "fj-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FFI call interface for FrankenJAX — the ONLY crate permitted to use unsafe code"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fj-core = { package = "frankenjax-core", version = "=0.1.0", path = "../fj-core" }
smallvec = { workspace = true }

[dev-dependencies]
fj-test-utils = { package = "frankenjax-test-utils", version = "=0.1.0", path = "../fj-test-utils" }
proptest = { workspace = true }
criterion = "0.8"

[[bench]]
name = "ffi_baseline"
harness = false
