[package]
name = "fj-backend-cpu"
version = "0.1.0"
edition = "2024"

[dependencies]
fj-core = { package = "frankenjax-core", version = "=0.1.0", path = "../fj-core" }
fj-runtime = { path = "../fj-runtime" }
fj-interpreters = { path = "../fj-interpreters" }
fj-lax = { package = "frankenjax-lax", version = "=0.1.0", path = "../fj-lax" }
rayon = "1.11"
rustc-hash = { workspace = true }

[dev-dependencies]
fj-test-utils = { package = "frankenjax-test-utils", version = "=0.1.0", path = "../fj-test-utils" }
proptest = { workspace = true }
criterion = "0.8"

[[bench]]
name = "backend_baseline"
harness = false
