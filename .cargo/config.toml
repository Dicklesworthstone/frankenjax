# Portable x86-64 baseline by default (`PrecisionPolicy::BitExactPortable`).
# Hardware AVX2+FMA acceleration (`#[target_feature(enable = "avx2,fma")]`) is
# dispatched dynamically at runtime via `std::arch::is_x86_feature_detected!`
# when `PrecisionPolicy::HardwareFmaAccelerated` is active.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-Z", "threads=4"]

[build]
# Parallel rustc front-end (nightly). Added by build-settings sweep.
rustflags = ["-Z", "threads=4"]

[env]
# Allow PyO3 0.23 to build and run against newer Python minor versions (e.g. Python 3.14)
# via the stable CPython ABI3 forward-compatibility contract.
PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1"

